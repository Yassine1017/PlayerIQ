[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "playeriq-backend"
version = "0.3.0"
description = "PlayerIQ authenticated GPS ingestion and analytics backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "SQLAlchemy==2.1.1",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "pdfplumber==0.11.10",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "PyJWT[crypto]==2.15.1",
  "supabase==2.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.16.9",
  "mypy==2.3.1",
  "reportlab==5.0.1",
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"db/migrations/versions/*.py" = ["E101", "E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "apps/api"
packages = ["app"]
ignore_missing_imports = true
